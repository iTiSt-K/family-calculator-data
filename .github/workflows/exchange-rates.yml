name: 환율 갱신

on:
  schedule:
    # 수출입은행은 영업일 오전 11시 전후에 고시 → 11:30, 16:00(KST)에 받는다.
    - cron: "30 2 * * 1-5"   # 11:30 KST
    - cron: "0 7 * * 1-5"    # 16:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: exchange-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: true  # 마지막 단계의 git push 에 필요

      - name: 환율 받기
        env:
          KOREAEXIM_API_KEY: ${{ secrets.KOREAEXIM_API_KEY }}
        run: python3 scripts/fetch_rates.py

      - name: 바뀌었으면 커밋
        run: |
          # Stage first: a brand-new file is invisible to plain `git diff`.
          git add exchange/
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "환율 갱신: $(python3 -c 'import json;print(json.load(open("exchange/rates.json"))["noticeDate"])') 고시"
          git push
